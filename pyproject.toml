[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-woodpecker"
version = "0.1.0"
description = "Training-free cross-modal hallucination mitigation for omni-modal language models"
requires-python = ">=3.10"

[tool.setuptools]
packages = [
  "owp",
  "owp.evaluation",
  "owp.models",
  "owp.modules",
]
